<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainfall History</title>
    <link rel="stylesheet" href="style.css?v=5">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        .back-btn {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1.2rem;
            background: #1a6fa8;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
        .back-btn:hover { background: #155a8a; }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-btn" href="/">&larr; Back to Dashboard</a>
        <h1>Rainfall History</h1>

        <div class="rain-charts-section">
            <div class="rain-charts-grid">
                <div class="rain-chart-card">
                    <h3>Last 60 Minutes</h3>
                    <canvas id="chart-60min"></canvas>
                </div>
                <div class="rain-chart-card">
                    <h3>Today by Hour</h3>
                    <canvas id="chart-today"></canvas>
                </div>
                <div class="rain-chart-card">
                    <h3>Last 7 Days</h3>
                    <canvas id="chart-7days"></canvas>
                </div>
                <div class="rain-chart-card">
                    <h3>Last 30 Days</h3>
                    <canvas id="chart-30days"></canvas>
                </div>
                <div class="rain-chart-card rain-chart-wide">
                    <h3>Year to Date by Month</h3>
                    <canvas id="chart-ytd"></canvas>
                </div>
            </div>
        </div>
    </div>
    <script src="rain.js?v=1"></script>
</body>
</html>
