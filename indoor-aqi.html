<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indoor Air Quality History</title>
    <link rel="stylesheet" href="style.css?v=5">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        .back-btn {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1.2rem;
            background: #f7971e;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
        .back-btn:hover { background: #e08010; }
        .aqi-chart-card {
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 1.5rem;
        }
        .aqi-chart-card h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-btn" href="/">&larr; Back to Dashboard</a>
        <h1>Indoor Air Quality History</h1>

        <div class="aqi-chart-card">
            <h3>CO2 Daily Average (ppm) &mdash; Year to Date</h3>
            <canvas id="chart-co2"></canvas>
        </div>
        <div class="aqi-chart-card">
            <h3>PM2.5 Daily Average (ug/m3) &mdash; Year to Date</h3>
            <canvas id="chart-pm25"></canvas>
        </div>
        <div class="aqi-chart-card">
            <h3>PM10 Daily Average (ug/m3) &mdash; Year to Date</h3>
            <canvas id="chart-pm10"></canvas>
        </div>
    </div>
    <script>
    function makeLine(id, labels, values, label, color) {
        new Chart(document.getElementById(id), {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label,
                    data: values,
                    borderColor: color,
                    backgroundColor: color.replace('1)', '0.1)'),
                    borderWidth: 2,
                    pointRadius: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: false }
                }
            }
        });
    }

    async function loadCharts() {
        const res = await fetch('/api/aqi/indoor/history');
        const data = await res.json();
        const labels = data.daily.map(r => r.day.slice(5));
        makeLine('chart-co2',  labels, data.daily.map(r => r.co2_avg),  'CO2 (ppm)',    'rgba(247, 151, 30, 1)');
        makeLine('chart-pm25', labels, data.daily.map(r => r.pm25_avg), 'PM2.5 ug/m3', 'rgba(255, 99, 132, 1)');
        makeLine('chart-pm10', labels, data.daily.map(r => r.pm10_avg), 'PM10 ug/m3',  'rgba(54, 162, 235, 1)');
    }
    loadCharts();
    </script>
</body>
</html>
